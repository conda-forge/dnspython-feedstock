schema_version: 1

context:
  version: "2.9.2"

package:
  name: dnspython
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dnspython/dnspython-${{ version }}.tar.gz
  sha256: 8d4d39a513e649d634004ce4d39ade2352efcea472a0247535a5c2d18a9d7ba9

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-build-isolation --no-deps

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build >=0.9.21,<0.13.0
  run:
    - python >=${{ python_min }},<4.0.0

tests:
  - python:
      imports:
        - dns
        - dns.rdtypes
        - dns.rdtypes.ANY
        - dns.rdtypes.IN
        - dns.rdtypes.CH
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: DNS toolkit
  license: ISC
  # Local copy of license until https://github.com/rthalley/dnspython/pull/1335 is merged and new release
  license_file: LICENSE
  homepage: http://www.dnspython.org
  repository: https://github.com/rthalley/dnspython
  documentation: http://www.dnspython.org

extra:
  recipe-maintainers:
    - synapticarbors
    - jan-janssen
    - xylar
